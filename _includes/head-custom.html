<style>
  /* Post listings (blather / useful) */
  .post-list { margin-top: 2rem; }
  .post-summary {
    padding: 0 0 2.25rem;
    margin: 0 0 2.25rem;
    border-bottom: 1px dashed #444;
  }
  .post-summary:last-child { border-bottom: none; }
  #main_content .post-title {
    font-size: 1.6rem;
    line-height: 1.3;
    margin: 0 0 0.35rem;
  }
  .post-title a { text-decoration: none; }
  .post-title a:hover { text-decoration: underline; }
  .post-date {
    color: #b5e853;
    font-size: 0.9rem;
    margin: 0 0 1rem;
    opacity: 0.85;
  }
  .post-date::before { content: ">> "; }
  /* Embedded media: own line, breathing room below */
  #main_content iframe,
  #main_content img {
    display: block;
    max-width: 100%;
    margin: 0 0 1.5rem;
  }
  /* Instagram embeds: crop Instagram's white header and footer,

  #main_content .ig-crop {
    width: 300px;
    max-width: 100%;
    overflow: hidden;
    border-radius: 4px;
    margin: 0 0 1.5rem;
  }
  #main_content .ig-crop iframe {
    width: 300px;
    margin: -54px 0 0;
    border: 0;
  }
  .post-excerpt p { margin: 0 0 0.75rem; }
  .read-more { font-size: 0.9rem; }
</style>
